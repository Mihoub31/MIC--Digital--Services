<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>دخول الإدارة | MIC Digital Services</title>
<style>
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:grid;place-items:center;background:#f3f6fa;font-family:Arial,Tahoma,sans-serif;color:#243b53;padding:20px}
.card{width:100%;max-width:420px;background:white;padding:32px;border-radius:16px;box-shadow:0 10px 35px #102a4315}
h1{margin:0 0 8px;color:#102a43;font-size:24px}
p{color:#829ab1;margin:0 0 25px}
label{display:block;font-weight:bold;margin:14px 0 7px}
input{width:100%;padding:13px;border:1px solid #d9e2ec;border-radius:8px;font-size:16px}
button{width:100%;padding:13px;margin-top:22px;border:0;border-radius:8px;background:#087e83;color:white;font-size:16px;cursor:pointer}
button:disabled{opacity:.6;cursor:wait}
#message{margin-top:15px;color:#b42318;min-height:22px;font-size:14px}
</style>
</head>
<body>
<main class="card">
<h1>MIC Digital Services</h1>
<p>تسجيل الدخول إلى لوحة الإدارة</p>
<form id="loginForm">
<label for="username">اسم المستخدم</label>
<input id="username" name="username" autocomplete="username" required>
<label for="password">كلمة المرور</label>
<input id="password" name="password" type="password" autocomplete="current-password" required>
<button id="submitButton" type="submit">تسجيل الدخول</button>
<div id="message" role="alert"></div>
</form>
</main>
<script src="/admin/login.js" defer></script>
</body>
</html>
